<style>
body {
  background: linear-gradient(to right, #e3f2fd, #ffffff);
  font-family: 'Segoe UI', Tahoma, sans-serif;
  margin: 0;
}

/* Header */
.site-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 40px;
  background: white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  color: white;
}

.logo { height: 60px; }

.nav-menu ul {
  list-style: none;
  display: flex;
  gap: 25px;
}

.nav-menu a {
  padding: 10px 18px;
  color: black;
  text-decoration: none;
  font-size: 18px;
}

.nav-menu a:hover {
  background: black;
  color: white;
  border-radius: 8px;
}
.summary-container {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 15px auto 25px auto;
  flex-wrap: wrap;
}

.summary-card {
  width: 180px;
  padding: 20px;
  border-radius: 12px;
  color: white;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.summary-card:hover {
  transform: translateY(-5px);
}

.summary-card .label {
  font-size: 14px;
  opacity: 0.9;
}

.summary-card .value {
  font-size: 28px;
  font-weight: bold;
  margin-top: 8px;
}

/* Colors */
.summary-card.total {
  background: linear-gradient(135deg, #2196f3, #64b5f6);
}

.summary-card.work {
  background: linear-gradient(135deg, #4caf50, #81c784);
}
/* Layout (Dashboard style) */
.calendar-container {
  display: grid;
  grid-template-columns: 2fr 1fr;
  max-width: 1200px;
  margin: 30px auto;
  gap: 20px;
}

#calendar {
  background: white;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

#logDetails {
  background: white;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  min-height: 400px;
}

#logDetails:hover {
  transform: translateY(-3px);
  transition: 0.2s;
}

/* Title */
h2 {
  text-align: center;
  color: #000000;
}

/* Calendar hover */
.fc-daygrid-day:hover {
  background-color: #e3f2fd;
  cursor: pointer;
}

/* Right panel */
.log-date {
  font-size: 24px;
  font-weight: bold;
  color: white;
  background: #000000;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  margin-bottom: 15px;
}

.log-content {
  background: #f8f9fa;
  border-left: 4px solid #000000;
  padding: 12px;
  border-radius: 6px;
  line-height: 1.6;
}

.selected-day {
  background-color: #bbdefb ;
  border-radius: 6px;
}

/* Responsive */
@media (max-width: 900px) {
  .calendar-container {
    grid-template-columns: 1fr;
  }
}
</style>

  }

  // Update log panel

    let event = events.find(e => e.date === dateStr);

        <div class="log-date">${formatDate(dateStr)}</div>

      `;

dayCellClassNames: function(arg) {

  let month = String(d.getMonth() + 1).padStart(2, '0');
  let day = String(d.getDate()).padStart(2, '0');

  let dateStr = `${year}-${month}-${day}`;

  if (dateStr === selectedDateStr) {

  }

  return [];
}
  });

  } 
  else if (e.key === "ArrowLeft") {
    currentDate.setDate(currentDate.getDate() - 1);
  }  
  else if (e.key === "ArrowUp") {
    currentDate.setDate(currentDate.getDate() - 7);
  } 
  else if (e.key === "ArrowDown") {
    currentDate.setDate(currentDate.getDate() + 7);
  }
  else return;

  let dateStr = currentDate.toISOString().split('T')[0];
