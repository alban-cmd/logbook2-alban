<style>
body {
  background: linear-gradient(to right, #e3f2fd, #ffffff);

.site-header {

.logo { height: 60px; }
.nav-menu ul { list-style: none; display: flex; gap: 25px; }
.nav-menu a { padding: 10px 18px; color: black; text-decoration: none; font-size: 18px; }
.nav-menu a:hover { background: black; color: white; border-radius: 8px; }

/* Toggle */
.view-toggle {
  display: flex;
  justify-content: center;
  margin: 18px auto 6px auto;
}
.toggle-btn {
  padding: 10px 32px;
  font-size: 15px;
  font-weight: 600;
  border: 2px solid #000;
  background: white;
  color: #000;
  cursor: pointer;
  transition: 0.2s;
  letter-spacing: 0.5px;
}
.toggle-btn:first-child { border-radius: 8px 0 0 8px; border-right: 1px solid #000; }
.toggle-btn:last-child  { border-radius: 0 8px 8px 0; border-left:  1px solid #000; }
.toggle-btn.active { background: #000; color: white; }

/* Summary cards */
.summary-container {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 15px auto 25px auto;
  flex-wrap: wrap;
}
.summary-card {
  width: 180px; padding: 20px; border-radius: 12px;
  color: white; text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.3s;
}
.summary-card:hover { transform: translateY(-5px); }
.summary-card .label { font-size: 14px; opacity: 0.9; }
.summary-card .value { font-size: 28px; font-weight: bold; margin-top: 8px; }
.summary-card.total { background: linear-gradient(135deg, #2196f3, #64b5f6); }
.summary-card.work  { background: linear-gradient(135deg, #4caf50, #81c784); }

h2 { text-align: center; color: #000; }

.calendar-container {

  margin: 10px auto 40px auto;

.week-card-meta {

  border-radius: 20px; font-weight: 500;
}
.rest-chip {
  background: #fff3e0; color: #e65100;

}
.chevron {

.chevron.open { transform: rotate(180deg); }

// ── Fix: parse date parts directly to avoid timezone shift ───────────────
function parseDateParts(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return { y, m, d };
}

function formatDate(dateStr) {
  const { y, m, d } = parseDateParts(dateStr);
  const months = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  return `${d} ${months[m-1]} ${y}`;
}

// Get Monday of the week (no timezone issues — pure arithmetic)
function getMonday(dateStr) {
  const { y, m, d } = parseDateParts(dateStr);
  const tmp = new Date(y, m - 1, d);          // local midnight, safe
  const dow = tmp.getDay();                    // 0=Sun
  const diff = dow === 0 ? -6 : 1 - dow;
  tmp.setDate(tmp.getDate() + diff);
  return `${tmp.getFullYear()}-${String(tmp.getMonth()+1).padStart(2,'0')}-${String(tmp.getDate()).padStart(2,'0')}`;
}

function getSunday(mondayStr) {
  const { y, m, d } = parseDateParts(mondayStr);
  const tmp = new Date(y, m - 1, d + 6);
  return `${tmp.getFullYear()}-${String(tmp.getMonth()+1).padStart(2,'0')}-${String(tmp.getDate()).padStart(2,'0')}`;
}

function groupByWeek() {
  const weeks = {};
  events.forEach(ev => {
    const mon = getMonday(ev.date);
    if (!weeks[mon]) weeks[mon] = [];
    weeks[mon].push(ev);
  });
  Object.keys(weeks).forEach(k => weeks[k].sort((a, b) => a.date.localeCompare(b.date)));
  return weeks;
}

// ── View toggle ───────────────────────────────────────────────────────────
function switchView(mode) {

  document.getElementById('btnWeekly').classList.toggle('active', mode === 'weekly');
  if (mode === 'weekly') renderWeeklyList();
}

// ── Weekly accordion ──────────────────────────────────────────────────────
function renderWeeklyList() {
  const container = document.getElementById('weekListContainer');
  const weeks     = groupByWeek();
  const sortedKeys = Object.keys(weeks).sort();
  let html = '';

  sortedKeys.forEach((mon, idx) => {
    const weekNum    = idx + 1;
    const sun        = getSunday(mon);
    const entries    = weeks[mon];
    const workEntries = entries.filter(e => e.type !== 'Rest day');
    const restEntries = entries.filter(e => e.type === 'Rest day');

    // chips for the collapsed header
    const taskChips = workEntries.map(e => `<span class="task-chip">${e.title}</span>`).join('');
    const restChips = restEntries.map(e => `<span class="rest-chip">🛌 ${e.title}</span>`).join('');

    // detail rows
    let detailHTML = '';
    entries.forEach(ev => {
      if (ev.type === 'Rest day') {
        detailHTML += `<div class="rest-day-row">🛌 ${formatDate(ev.date)} — ${ev.title}</div>`;
      } else {
        detailHTML += `
          <div class="week-day-entry">
            <div class="week-day-title">
              <span>${formatDate(ev.date)}</span>
              <span class="work-badge">Work Day</span>
              <span style="color:#333;font-weight:600;">${ev.title}</span>
            </div>
            <div class="week-day-detail">${ev.details}</div>
          </div>`;
      }
    });

    html += `
      <div class="week-card" id="wcard-${mon}">
        <div class="week-card-header" onclick="toggleWeek('${mon}')">
          <div class="week-card-left">
            <div class="week-card-title">Week ${weekNum} &nbsp;·&nbsp; ${formatDate(mon)} – ${formatDate(sun)}</div>
            <div class="week-card-meta">
              <span>💼 ${workEntries.length} work day${workEntries.length !== 1 ? 's' : ''}</span>
              <span>🛌 ${restEntries.length} rest day${restEntries.length !== 1 ? 's' : ''}</span>
            </div>
            <div class="week-chips">${taskChips}${restChips}</div>
          </div>
          <span class="chevron" id="chev-${mon}">▾</span>
        </div>
        <div class="week-card-body" id="wbody-${mon}">
          ${detailHTML}
        </div>
      </div>`;
  });

  container.innerHTML = html;

  // Auto-open the first week
  if (sortedKeys.length > 0) toggleWeek(sortedKeys[0]);
}

function toggleWeek(mon) {
  const body  = document.getElementById('wbody-' + mon);
  const chev  = document.getElementById('chev-'  + mon);
  const header = body.previousElementSibling;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open',  !isOpen);
  chev.classList.toggle('open',  !isOpen);
  header.classList.toggle('open',!isOpen);
}

    initialDate:  '2026-04-01',
    validRange:   { start: '2026-04-01', end: '2026-08-01' },
    headerToolbar: { left: 'prev,next', center: 'title', right: '' },
    events: events,

    dateClick: function(info) {
      currentDate    = new Date(info.date.getFullYear(), info.date.getMonth(), info.date.getDate());
      selectedDateStr = toDateStr(currentDate);
      updateLog(selectedDateStr);
      calendar.render();
    },

    eventClick: function(info) {
      info.jsEvent.preventDefault();
      const d = info.event.start;
      currentDate     = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      selectedDateStr = toDateStr(currentDate);
      updateLog(selectedDateStr);
      calendar.gotoDate(selectedDateStr);
      calendar.render();
    },

    dayCellClassNames: function(arg) {
      const d   = arg.date;
      const str = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      return str === selectedDateStr ? ['selected-day'] : [];
    }
  });

  calendar.render();

  document.addEventListener('keydown', function(e) {
    if (currentMode !== 'daily') return;
    if      (e.key === 'ArrowRight') currentDate.setDate(currentDate.getDate() + 1);
    else if (e.key === 'ArrowLeft')  currentDate.setDate(currentDate.getDate() - 1);
    else if (e.key === 'ArrowUp')    currentDate.setDate(currentDate.getDate() - 7);
    else if (e.key === 'ArrowDown')  currentDate.setDate(currentDate.getDate() + 7);
    else return;

    const dateStr = toDateStr(currentDate);
    if (dateStr < '2026-04-01' || dateStr > '2026-07-31') return;
    selectedDateStr = dateStr;
    calendar.gotoDate(dateStr);
    updateLog(dateStr);
    calendar.render();
  });
});
</script>
</body>
</html>
